apiVersion: v1
kind: Secret
metadata:
  name: calc-api-alertmanager-config
  labels:
    app: calc-api
stringData:
  alertmanager.yml: |
    route:
      receiver: default
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: pager
          continue: false
        - match:
            severity: warning
          receiver: slack
          continue: false
        - match:
            severity: info
          receiver: default
          continue: false

    receivers:
      - name: default
      - name: pager
        webhook_configs:
          - url: "http://pagerduty-webhook.monitoring:8080"
            send_resolved: true
      - name: slack
        slack_configs:
          - api_url: "https://hooks.slack.com/services/T00000000/B00000000/xxxxxxxx"
            channel: "#alerts-calc-api"
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            send_resolved: true

    templates:
      - /etc/alertmanager/templates/*.tmpl
